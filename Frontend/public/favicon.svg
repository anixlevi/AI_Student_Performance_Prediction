<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded squircle background -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)"/>

  <!-- subtle inner glow ring -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <g filter="url(#softShadow)">
    <!-- Minimal geometric cap (flat top) -->
    <path d="M32 16 L50 24.5 L32 33 L14 24.5 Z" fill="url(#capGrad)"/>
    <!-- Cap base / band -->
    <path d="M21 27.5 V36.5 C21 40.5 26 43.5 32 43.5 C38 43.5 43 40.5 43 36.5 V27.5 L32 33 Z"
          fill="url(#capGrad)" fill-opacity="0.85"/>
    <!-- Tassel string + node -->
    <line x1="50" y1="24.5" x2="50" y2="34" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="50" cy="36" r="2" fill="#ffffff"/>
  </g>

  <!-- AI node accent (top-right, minimal dot-spark) -->
  <circle cx="47" cy="15" r="3.2" fill="#facc15"/>
  <circle cx="47" cy="15" r="5.2" fill="none" stroke="#facc15" stroke-opacity="0.4" stroke-width="1.2"/>
</svg>